name: Publish FickLab.exe

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -r requirements-app.txt

      - name: Build FickLab.exe
        run: python -m PyInstaller --noconfirm --clean FickLab.spec

      - name: Verify python312.dll and VC runtime are in the exe
        shell: pwsh
        run: |
          @'
          from PyInstaller.archive.readers import CArchiveReader
          archive = CArchiveReader("dist/FickLab.exe")
          toc = archive.toc
          names = {name.lower() for name in toc} if hasattr(toc, "items") else {str(entry[0]).lower() for entry in toc}
          missing = sorted({"python312.dll", "vcruntime140.dll"} - names)
          print("ok", sorted(n for n in names if n.endswith(".dll") and ("python" in n or "vcruntime" in n)))
          if missing:
              raise SystemExit("exe is missing: " + ", ".join(missing))
          '@ | python -

      - name: Attach the exe to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath dist/FickLab.exe)) {
            throw "dist/FickLab.exe was not built."
          }
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/FickLab.exe --clobber
          } else {
            gh release create $tag dist/FickLab.exe --title $tag --generate-notes --verify-tag
          }
          $asset = gh release view $tag --json assets --jq '.assets[] | select(.name == "FickLab.exe") | .name'
          if ($asset -ne "FickLab.exe") {
            throw "FickLab.exe is missing from the release."
          }
