name: Publish FickLab.exe

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -r requirements-app.txt

      - name: Build FickLab.exe
        run: python -m PyInstaller --noconfirm --clean FickLab.spec

      - name: Attach the exe to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath dist/FickLab.exe)) {
            throw "dist/FickLab.exe was not built."
          }
          gh release create $env:GITHUB_REF_NAME dist/FickLab.exe --title $env:GITHUB_REF_NAME --generate-notes --verify-tag
          $asset = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets[] | select(.name == "FickLab.exe") | .name'
          if ($asset -ne "FickLab.exe") {
            throw "FickLab.exe is missing from the release."
          }
