name: Publish FickLab.exe

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -r requirements-app.txt

      - name: Build FickLab.exe
        run: python -m PyInstaller --noconfirm --clean FickLab.spec

      - name: Attach the exe to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FickLab.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
